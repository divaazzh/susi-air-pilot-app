name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'nuxt/package-lock.json'

      - name: Install Nuxt Dependencies
        run: |
          cd nuxt
          npm ci

      - name: Generate Static Nuxt Site
        run: |
          cd nuxt
          npm run generate
        env:
          NUXT_APP_BASE_URL: /susi-air-pilot-app/
          NUXT_PUBLIC_API_BASE: https://susi-air-pilot-app-backend.onrender.com

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'nuxt/.output/public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
